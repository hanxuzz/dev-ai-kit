# 可提交的项目配置示例。安装脚本会按这个结构生成，不会覆盖已有文件。
# 本机绝对路径写在 project.local.yaml。口令不写在这里。

project: psl

repos:
  frontend: frontend
  backend: backend

docs:
  # repo | share | local
  mode: local
  path: docs

runtime:
  backend:
    start: ""
  frontend:
    start: ""
  database:
    readonly: false
    bitwarden: ""
  test: ""

secrets:
  # Bitwarden 文件夹名，例如 个人/psl。口令不写在这里。
  bitwarden_folder: ""

# 先看 docs/conventions.md。confirmed 写成 true 之前，这些只是建议，不会自动建分支。
conventions:
  confirmed: false
  branch:
    enabled: true
    base: ""
    pattern: "feature/{id}"
  commit:
    only_when_asked: true
    allow_on_base: false
  push:
    only_when_asked: true
  trailer:
    coauthor: false
