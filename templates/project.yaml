# 团队可提交配置。机器绝对路径与凭证正文不得写入。
schema_version: 2
project: example
repos:
  frontend: frontend
  backend: backend
docs:
  mode: local
  path: docs
  requirements_dir: requirements
runtime:
  # 检查按需执行。没有 database 依赖的单元测试不要求连接数据库。
  checks: {}
  # 配置示例（先确认项目已有命令，再取消注释）：
  # frontend-unit:
  #   repo: frontend
  #   argv: [npm, run, test, --, --run]
  #   cwd: .
  #   timeout_seconds: 120
  #   requires: []
  database:
    readonly: false
    bitwarden: ""
  services: {}
secrets:
  bitwarden_folder: ""
conventions:
  confirmed: false
  branch:
    # project: 按团队 allowed_pattern 检查；current: 明确允许当前分支；feature: 按需求分支
    mode: project
    allowed_pattern: ""
    base: ""
    pattern: "feature/{id}"
    # 是否代建分支与正确分支的判断分开。核心命令不自动执行 Git 写入。
    auto_create: false
  commit:
    only_when_asked: true
    allow_on_base: false
  push:
    only_when_asked: true
  trailer:
    coauthor: false
